# XcodeGen spec. Generate the project with: xcodegen generate
# The .xcodeproj is not committed; this file is the source of truth.
name: TronIPTV
options:
  bundleIdPrefix: mk.troniptv
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug: debug
  Release: release
  AppStore: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
  AppStore: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

targets:
  TronIPTVCore:
    type: framework
    platform: macOS
    sources:
      - Sources/TronIPTVCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mk.troniptv.app.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
        OTHER_LDFLAGS: -lz

  TronIPTV:
    type: application
    platform: macOS
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
    dependencies:
      - target: TronIPTVCore
        embed: true
      - framework: Frameworks/VLCKit.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: TronIPTV
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/TronIPTV.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_PREVIEWS: YES
        COMBINE_HIDPI_IMAGES: YES
      configs:
        AppStore:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE
    scheme:
      testTargets:
        - TronIPTVCoreTests

  TronIPTVCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TronIPTVCoreTests
    dependencies:
      - target: TronIPTVCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: mk.troniptv.app.tests
        CODE_SIGNING_ALLOWED: NO

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app

      - name: Cache VLCKit
        uses: actions/cache@v4
        with:
          path: Frameworks
          key: vlckit-${{ hashFiles('scripts/fetch-vlckit.sh') }}

      - name: Fetch VLCKit
        run: scripts/fetch-vlckit.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Test
        run: >
          xcodebuild test -project TronIPTV.xcodeproj -scheme TronIPTV
          -destination 'platform=macOS' -resultBundlePath build/TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO

      - name: Build app (unsigned)
        run: >
          xcodebuild build -project TronIPTV.xcodeproj -scheme TronIPTV -configuration Release
          -destination 'generic/platform=macOS' -derivedDataPath build/DerivedData
          CODE_SIGNING_ALLOWED=NO

      - name: SwiftPM build
        run: swift build --product TronIPTV

      - name: Package build
        run: ditto -c -k --keepParent build/DerivedData/Build/Products/Release/TronIPTV.app build/TronIPTV-unsigned.zip

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/TestResults.xcresult
          retention-days: 14

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: TronIPTV-macOS-unsigned-${{ github.sha }}
          path: build/TronIPTV-unsigned.zip
          retention-days: 14
